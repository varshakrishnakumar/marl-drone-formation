# filepath: systems/configs/ppo_multi_full.yaml
common:
  log_dir: runs/ppo_multi
  n_envs: 8
  n_steps: 2048
  n_epochs: 10
  learning_rate: 0.0003
  ent_coef: 0.001
  vf_coef: 1.0
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  target_kl: 0.03
  max_grad_norm: 0.5
  save_every_steps: 500000
  eval_every_steps: 250000
  eval_episodes: 5
  total_timesteps: 3000000
  auto_timestamp: true

stages:
  - name: stage1_easy
    leader_speed_scale: 0.3
    spawn_in_formation: true
    disable_dynamic: true
    # shaping lighter here
    form_under_threat_gain: 1.0
    evade_gain: 0.4

  - name: stage2_threat
    leader_speed_scale: 0.8
    spawn_in_formation: true
    disable_dynamic: false
    resume_from_prev: true
    # <<< stronger under threat >>>
    form_under_threat_gain: 1.8
    evade_gain: 0.7
    threat_radius: 0.8
    safe_radius: 1.5
    form_var_gain: 0.3

  - name: stage3_full
    leader_speed_scale: 1.0
    spawn_in_formation: true
    disable_dynamic: false
    resume_from_prev: true
    form_under_threat_gain: 2.0
    evade_gain: 0.8
    threat_radius: 0.8
    safe_radius: 1.6
    form_var_gain: 0.35
