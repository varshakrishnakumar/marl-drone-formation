stages:
  - name: stage0_hover_foundation
    # **Stage 0: Formation Hover Foundation**
    # Purpose: Establish basic hovering and formation stability with no obstacles or threats.
    # All 5 drones start in a tight formation and learn to minimize drift.
    # Tuning: Use a low learning rate and no exploration noise for stable convergence.
    # No STL shaping yet (focus purely on stability).
    learning_rate: 0.00015          # Lower LR for initial convergence
    n_epochs: 5                     # Fewer epochs to avoid overfitting simple task
    clip_range: 0.15                # Smaller updates for stability
    ent_coef: 0.0                   # No entropy (exploration) – prioritize stability
    target_kl: 0.015
    alive_bonus: 0.4                # Small reward each step for staying airborne (encourage stable flight)
    formation_break_penalty: 2000   # Heavy penalty if formation totally breaks
    # (Formation-break termination is disabled in this stage to let drones recover)
    formation_break_mean: 9999.0    # No episode termination on formation error
    formation_break_max: 9999.0
    total_timesteps: 2000000
    leader_speed_scale: 0.0         # Formation is static (no movement)
    disable_dynamic: true           # No dynamic obstacles
    obstacle_repulse_gain: 0.0      # No static obstacles yet
    static_clear_gain: 0.0
    # Formation reward: encourage maintaining relative positions (slot cohesion)
    form_w_mean: 1.6
    form_w_max: 0.25
    form_var_gain: 0.25
    alt_w: 1.0                      # Emphasize altitude stability
    huber_delta: 0.35
    formation_spacing: 1.0          # Nominal spacing (e.g., 1.0m between drones)
    min_sep: 0.55
    sep_radius: 0.60
    sep_gain: 1.2
    sep_hysteresis: 0.08
    sep_force: 0.60
    max_roll_deg: 4                 # Restrict tilt for stability
    max_pitch_deg: 4
    max_yaw_rate_deg: 20
    thrust_delta_scale: 0.12
    stl_margin_weight: 0.0          # **No STL shaping** in Stage 0
    # Explanation: Drones learn to hover in formation without any disturbances.
    # The low clip_range and learning_rate ensure gentle policy updates, preventing oscillations.
    # By removing termination on formation error, agents can drift and correct themselves within an episode, 
    # learning to recenter and stabilize.

  - name: stage1_hover_obstacles
    # **Stage 1: Formation Hover with Static Obstacles**
    # Purpose: Introduce static obstacle avoidance while hovering in formation.
    # A few static obstacles (e.g., columns) are present; drones must maintain formation 
    # and keep a safe distance from obstacles.
    # Tuning: Gradually introduce obstacle repulsion and STL shaping for safety specs.
    total_timesteps: 1000000
    leader_speed_scale: 0.0
    disable_dynamic: true           # Still no dynamic threat
    obstacle_repulse_gain: 0.4      # Weak repulsive force from obstacles
    static_clear_gain: 0.05         # Small reward for keeping clearance from obstacles
    # Formation weights remain high to prevent breaking formation around obstacles.
    form_w_mean: 1.7
    form_w_max: 0.30
    form_var_gain: 0.25
    alt_w: 0.9
    # (Other formation parameters like sep_gain remain similar to Stage 0)
    max_roll_deg: 5                # Slightly relax tilt limits as control improves
    max_pitch_deg: 5
    max_yaw_rate_deg: 25
    thrust_delta_scale: 0.14
    ent_coef: 0.0003               # Introduce a bit of exploration noise
    target_kl: 0.015
    stl_margin_weight: 5.0         # **Begin STL shaping** with low weight
    # Explanation: Drones learn to respect obstacle clearance while hovering together.
    # Obstacle repulsion prevents any drone from getting too close to a static object, 
    # and a small static_clear_gain rewards maintaining a safe buffer. 
    # Formation maintenance is still the primary objective, backed by STL constraints (with a gentle weight) 
    # to start encoding formal safety specs. Exploration is turned on slightly now that basic stability is learned.

  - name: stage2_move_slow_static
    # **Stage 2: Slow Formation Movement with Static Obstacles**
    # Purpose: The formation now translates (slowly) across the environment, requiring drones to move in sync 
    # while avoiding static obstacles.
    # Task: A designated leader (or virtual target) moves at a slow speed; others must follow, preserving formation.
    # Tuning: Increase obstacle avoidance weights and formation tightness moderately.
    total_timesteps: 2000000
    leader_speed_scale: 0.20       # Slow forward movement for the formation
    disable_dynamic: true
    obstacle_repulse_gain: 0.6     # Stronger repulsion from obstacles
    static_clear_gain: 0.20        # Reward keeping clear of obstacles (more emphasis than Stage 1)
    form_w_mean: 1.9
    form_w_max: 0.35
    form_var_gain: 0.28
    huber_delta: 0.38
    alt_w: 0.8
    formation_spacing: 0.90        # Slightly tighter formation (drones stay closer together)
    # Separation parameters adjusted to prevent crowding as formation spacing tightens
    sep_gain: 1.4
    sep_force: 0.75
    max_roll_deg: 6
    max_pitch_deg: 6
    max_yaw_rate_deg: 30
    thrust_delta_scale: 0.16
    stl_margin_weight: 10.0        # Increase STL weight for safety/formation specs (mild enforcement)
    # Explanation: Now the team practices moving as a cohesive unit. With a slow leader trajectory and static obstacles, 
    # they learn to **maneuver around obstacles without breaking formation**:contentReference[oaicite:3]{index=3}. 
    # Formation error penalties remain significant, while higher static_clear_gain ensures they actively avoid collisions with obstacles.
    # STL specs (for formation distance, obstacle clearance, etc.) have a higher weight, guiding the policy to satisfy these requirements more strictly.

  - name: stage3_move_medium_static
    # **Stage 3: Moderate-Speed Formation Flight with Static Obstacles**
    # Purpose: Refine formation-keeping at a higher speed and tighter spacing before introducing dynamic threats.
    # Task: Formation moves faster, requiring quicker adjustments around obstacles.
    # Tuning: Formation spacing is tightened; obstacle avoidance gains increased. Lower learning rate to stabilize learning at this tougher stage.
    total_timesteps: 2500000
    leader_speed_scale: 0.35       # Moderate movement speed
    disable_dynamic: true
    obstacle_repulse_gain: 0.7     # Slightly stronger obstacle repulsion than Stage 2
    static_clear_gain: 0.25        # Encourage obstacle clearance, but not too high to avoid solo detours
    form_w_mean: 2.1
    form_w_max: 0.40
    form_var_gain: 0.30
    huber_delta: 0.40
    alt_w: 0.7
    formation_spacing: 0.85        # Tighten formation (drones must stay closer)
    sep_gain: 1.6
    sep_force: 0.85
    max_roll_deg: 7
    max_pitch_deg: 7
    max_yaw_rate_deg: 40
    thrust_delta_scale: 0.18
    # **PPO hyperparam tweaks for stability at higher difficulty:**
    learning_rate: 0.0002         # Reduce LR to fine-tune without forgetting prior skills
    clip_range: 0.15             # Smaller clip range for conservative policy updates
    stl_margin_weight: 20.0      # Stronger STL shaping – enforce formation & safety specs
    # Explanation: This stage pushes the policy to handle faster group motion. We decrease the PPO learning rate and clip range here, 
    # ensuring the agents adapt gradually to the increased difficulty without catastrophic forgetting of the formation skill acquired earlier. 
    # By the end of Stage 3, the drones can **fly in close formation and skirt around static obstacles smoothly**:contentReference[oaicite:4]{index=4}. 
    # The STL weight is raised to solidify rule adherence (formation cohesion and obstacle clearance), preventing performance degradation as complexity grows.

  - name: stage4_threat_intro
    # **Stage 4: Introduction of a Dynamic Threat (Coordinated Evasion)**
    # Purpose: Teach the drones to avoid a moving obstacle as a group while maintaining formation integrity.
    # Task: A single dynamic threat (e.g., a moving sphere) is introduced with mild behavior.
    # It approaches the team, and the drones must collectively maneuver to avoid it (e.g., sidestep or rise together) and then reform once it passes.
    # Tuning: Emphasize formation-under-threat rewards, moderate safe distance bonus, and allow more formation deviation (to avoid premature termination).
    total_timesteps: 3000000
    leader_speed_scale: 0.50       # Formation continues to move (moderate pace) during threat encounters
    disable_dynamic: false         # Enable dynamic threat
    chase_mode: "nearest"          # Threat targets the nearest drone (predictable chase)
    dynamic_aggression: 0.25       # Low threat speed/aggression for introduction
    retarget_interval: 3.0
    retarget_on_close: true
    retarget_close_dist: 0.7
    dynamic_repulse_radius: 1.05
    dynamic_repulse_gain: 0.70
    threat_radius: 1.6
    danger_radius: 0.95
    safe_radius: 2.0
    evade_gain: 0.4
    avoid_scale: 2.5
    safe_bonus: 2.0               # Reward for each drone staying beyond safe_radius from threat
    form_under_threat_gain: 1.5   # Extra reward factor for maintaining formation *while threat is nearby*
    obstacle_repulse_gain: 0.7    # Keep static obstacle avoidance from Stage 3
    static_clear_gain: 0.30       # Maintain obstacle clearance reward
    form_w_mean: 2.2
    form_w_max: 0.45
    form_var_gain: 0.30
    alt_w: 0.7
    formation_spacing: 0.84
    sep_gain: 1.8
    sep_hysteresis: 0.06
    sep_force: 0.95
    max_roll_deg: 8
    max_pitch_deg: 8
    max_yaw_rate_deg: 45
    thrust_delta_scale: 0.22
    # Allow greater temporary formation deviation to permit evasive maneuvers:
    formation_break_mean: 3.0     # Looser formation threshold before terminating
    formation_break_max: 4.0
    # PPO adjustments for new task complexity:
    learning_rate: 0.00015        # Further reduce LR for fine-grained adaptation
    clip_range: 0.1               # Smaller clip for cautious policy updates
    stl_margin_weight: 50.0       # Heavily enforce STL specs (safety + formation)
    # Explanation: In Stage 4, the team learns **coordinated threat avoidance**. The dynamic obstacle is gentle; drones are rewarded for staying safe (safe_bonus) 
    # but *also* for keeping formation during the evasive maneuver (form_under_threat_gain increased). This dual incentive encourages solutions where they move **together** 
    # rather than scattering. We relax formation-break termination limits so that a drone can momentarily stray further without ending the episode, giving it a chance to regroup afterward. 
    # This is important for learning to reform formation after evading a threat. PPO updates are made very conservative here, to avoid destabilizing the policy when adding the moving threat dimension:contentReference[oaicite:5]{index=5}.

  - name: stage5_threat_advanced
    # **Stage 5: Advanced Dynamic Threat Avoidance (Randomized)**
    # Purpose: Challenge the formation with a less predictable, more aggressive threat to solidify cooperative evasion behaviors.
    # Task: The dynamic obstacle moves faster and can retarget randomly, simulating a challenging scenario. Drones must react collectively to avoid it from various directions.
    # Tuning: Increase threat aggression, maintain high formation importance but begin to prioritize survival slightly more. No formation-based termination.
    total_timesteps: 3500000
    leader_speed_scale: 0.80      # Formation moves faster, adding to challenge
    disable_dynamic: false
    chase_mode: "random"          # Threat switches target randomly, forcing general group awareness
    dynamic_aggression: 0.55      # Higher speed/aggression
    retarget_interval: 2.2
    retarget_on_close: true
    retarget_close_dist: 0.60
    dynamic_repulse_radius: 1.05
    dynamic_repulse_gain: 0.85
    threat_radius: 1.5
    danger_radius: 1.0
    safe_radius: 2.1
    evade_gain: 0.6
    avoid_scale: 3.0
    safe_bonus: 2.5              # Slightly larger safe-distance reward to prioritize not getting hit
    form_under_threat_gain: 1.5  # Reward for holding formation under threat (keep high to discourage complete breakup)
    obstacle_repulse_gain: 0.8
    static_clear_gain: 0.40
    form_w_mean: 2.4
    form_w_max: 0.50
    form_var_gain: 0.32
    huber_delta: 0.42
    alt_w: 0.65
    formation_spacing: 0.80      # Tightest formation spacing so far (high precision)
    sep_gain: 2.0
    sep_force: 1.05
    max_roll_deg: 10
    max_pitch_deg: 10
    max_yaw_rate_deg: 60
    thrust_delta_scale: 0.25
    # Remove formation-break terminations to focus on survival and recovery:
    formation_break_mean: 9999.0   # No episode termination for formation error
    formation_break_max: 9999.0
    # (The team is allowed to break formation if absolutely necessary, and then regroup, rather than ending the run)
    stl_margin_weight: 75.0        # Further increase STL weight – specs (formation & safety) are critical
    # PPO hyperparameters: keep learning rate low and clip range small for fine-tuning
    learning_rate: 0.0001
    clip_range: 0.1
    # Explanation: By Stage 5, the drones face a difficult, unpredictable threat. The curriculum up to this point (static then dynamic) should prepare them to handle this:contentReference[oaicite:6]{index=6}. 
    # We disable formation-break terminations entirely now, since **survival is prioritized** – the swarm must not crash even if that means temporarily losing formation:contentReference[oaicite:7]{index=7}. 
    # However, heavy formation and STL rewards remain, so agents are still incentivized to re-form quickly after dodging. The safe_bonus and other avoidance rewards are elevated to ensure collisions are avoided at all costs. 
    # This stage tests and reinforces the learned strategy of *collective evasion*: ideally one drone initiates an avoidance maneuver and the others follow, maintaining cohesion. If the formation does split, 
    # agents are trained to **reassemble the formation once the threat has passed** (a behavior encouraged by the persistent formation reward and high STL spec weight).

  - name: stage6_threat_extreme
    # **Stage 6: Extreme Threat Evasion and Formation Recovery**
    # Purpose: Final stage to polish behavior under the most extreme threat scenario. Drones must demonstrate that they can survive a highly aggressive obstacle and still maintain teamwork.
    # Task: The dynamic obstacle moves very aggressively and intelligently (worst-case pursuit). Drones should prioritize not getting hit, but attempt to keep formation integrity as much as possible.
    # Tuning: Max out STL (strict task adherence), provide a small survival reward, and slightly dial back formation coupling if needed to prevent sacrificing safety.
    total_timesteps: 4000000
    leader_speed_scale: 1.00      # Full-speed formation travel
    disable_dynamic: false
    chase_mode: "most_error"      # Threat targets the drone that is easiest to catch (e.g., the one lagging or out of position)
    dynamic_aggression: 0.80      # Highest threat speed and aggression
    retarget_interval: 1.6
    retarget_on_close: true
    retarget_close_dist: 0.50
    dynamic_repulse_radius: 1.10
    dynamic_repulse_gain: 1.00
    threat_radius: 1.4
    danger_radius: 1.0
    safe_radius: 2.2
    evade_gain: 0.7
    avoid_scale: 3.5
    safe_bonus: 3.0              # High reward for staying out of danger
    form_under_threat_gain: 1.2  # (Slightly reduced to avoid overly rigid formation if unsafe, but still present)
    obstacle_repulse_gain: 0.9
    static_clear_gain: 0.55
    form_w_mean: 2.8
    form_w_max: 0.60
    form_var_gain: 0.35
    huber_delta: 0.45
    alt_w: 0.6
    formation_spacing: 0.78      # Very tight formation target (for maximum challenge when possible)
    sep_gain: 2.2
    sep_hysteresis: 0.05
    sep_force: 1.15
    max_roll_deg: 10
    max_pitch_deg: 10
    max_yaw_rate_deg: 60
    thrust_delta_scale: 0.28
    formation_break_mean: 9999.0   # (Remain disabled – never terminate for formation error)
    formation_break_max: 9999.0
    alive_bonus: 0.2               # Small reward each step for staying alive (encourages maximizing episode length)
    stl_margin_weight: 100.0       # **Maximum STL weight** – strict enforcement of all specs (formation, separation, safety)
    # Explanation: The final stage pushes the policy to its limits. The threat is extremely aggressive, so the drones have full incentive to evade however necessary to avoid collisions. 
    # A tiny alive_bonus is given to reinforce survival as an objective in itself (longer episodes yield more reward), complementing the safe_bonus. We keep formation incentives (form_under_threat_gain and formation rewards) in play, 
    # but slightly lowered compared to earlier dynamic stages to ensure drones won’t risk a collision just to hold formation. The expectation is that **the swarm will perform agile evasive maneuvers (even splitting if needed) and then regroup immediately after**. 
    # With STL robustness weight at its highest, any violation of task specs (such as excessive formation error or unsafe distances) heavily impacts reward, guiding the learned policy to meet all objectives as much as possible under this extreme scenario:contentReference[oaicite:8]{index=8}.
