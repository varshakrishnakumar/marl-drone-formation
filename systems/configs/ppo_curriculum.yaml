common:
  # PPO / training hyperparameters
  algo: ppo_multi
  n_envs: 8
  n_steps: 2048
  n_epochs: 6
  learning_rate: 1e-4
  ent_coef: 5e-4
  vf_coef: 1.0
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  target_kl: 0.02
  max_grad_norm: 0.5
  eval_use_train_options: true

  # Per-stage training length & bookkeeping
  total_timesteps: 1_800_000
  save_every_steps: 163_840
  eval_every_steps: 163_840
  eval_episodes: 5

  # Let later stages automatically resume from previous stage
  resume_from_prev: true    # train_launcher pops this per stage

stages:
  - name: stage0_warm
    # Environment / reset options
    leader_speed_scale: 0.0        # frozen leader
    spawn_in_formation: true       # start in diamond formation
    disable_dynamic: true          # no chasing sphere yet

    # Reward shaping / formation weights
    form_w_mean: 1.8
    form_w_max: 0.9
    form_var_gain: 0.35
    alt_w: 0.9
    huber_delta: 0.3

    # Separation / spacing
    formation_spacing: 0.9
    min_sep: 0.55
    sep_radius: 0.38
    sep_gain: 1.2
    sep_hysteresis: 0.06

    # Control smoothness and thrust authority
    thrust_delta_scale: 0.05
    speed_smooth_gain: 0.06

    # Attitude limits (gentle)
    max_roll_deg: 3
    max_pitch_deg: 3
    max_yaw_rate_deg: 30

  - name: stage1_easy
    # Moving leader, still no dynamic threat
    leader_speed_scale: 0.3
    spawn_in_formation: true
    disable_dynamic: true

    # Formation & altitude weights
    form_w_mean: 2.0          # was 1.8  → care a bit more about formation
    form_w_max: 1.0           # was 0.9
    form_var_gain: 0.35
    alt_w: 1.2                # was 0.9  → stronger height tracking
    huber_delta: 0.3

    formation_spacing: 0.9
    min_sep: 0.55
    sep_radius: 0.38
    sep_gain: 1.2
    sep_hysteresis: 0.06

    # Control smoothness / authority
    thrust_delta_scale: 0.04  # was 0.05 → slightly less aggressive thrust
    speed_smooth_gain: 0.06

    # Attitude limits (a bit tighter than before)
    max_roll_deg: 4           # was 5
    max_pitch_deg: 4          # was 5
    max_yaw_rate_deg: 45

    # *** NEW: strong safety penalties ***
    att_w: 1.5                # default was 0.5 → 3× penalty on big tilt
    collision_penalty: 40.0   # was 8.0 → crash = -0.4 reward instead of -0.08

    # Optional: keep them from drifting too far sideways
    workspace_radius: 2.0
    workspace_gain: 0.4

  - name: stage2_threat_easy
    leader_speed_scale: 0.3
    spawn_in_formation: true
    disable_dynamic: false

    dynamic_aggression: 0.3
    chase_mode: nearest

    # Formation / altitude (keep as-is or nudge up slightly)
    form_w_mean: 1.8
    form_w_max: 0.9
    form_var_gain: 0.35
    alt_w: 1.2           # was 0.9 → care more about altitude

    # Smoothness / attitude
    speed_smooth_gain: 0.06
    thrust_delta_scale: 0.05

    max_roll_deg: 5
    max_pitch_deg: 5
    max_yaw_rate_deg: 45

    # NEW: attitude penalty weight
    att_w: 1.5           # default was 0.5 → triple the penalty for large roll/pitch

    # Collisions: make them hurt much more
    terminate_on_drone_collision: true
    collision_penalty: 40.0   # 40 * 0.01 = -0.4 reward hit on crash (was -0.08)

    # Workspace shaping (keep as you had)
    workspace_radius: 2.0
    workspace_gain: 0.4

    # Separation / spacing as before...
    formation_spacing: 0.9
    min_sep: 0.55
    sep_radius: 0.38
    sep_gain: 1.2
    sep_hysteresis: 0.06
