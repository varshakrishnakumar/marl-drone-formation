common:
  algo: ppo_multi
  n_envs: 8
  n_steps: 2048
  n_epochs: 6
  learning_rate: 1e-4
  ent_coef: 5e-4
  vf_coef: 1.0
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  target_kl: 0.02
  max_grad_norm: 0.5
  total_timesteps: 1_800_000
  save_every_steps: 163_840
  eval_every_steps: 163_840
  eval_episodes: 5
  resume_from_prev: true    # this is the important part

multi_stage:
  - name: stage0_warm
    env_kwargs:
      leader_speed_scale: 0.0
      spawn_in_formation: true
      disable_dynamic: true
      form_w_mean: 1.8
      form_w_max: 0.9
      form_var_gain: 0.35
      alt_w: 0.9
      huber_delta: 0.3
      formation_spacing: 0.9
      min_sep: 0.55
      sep_radius: 0.38
      sep_gain: 1.2
      sep_hysteresis: 0.06
      thrust_delta_scale: 0.05
      speed_smooth_gain: 0.06
      max_roll_deg: 3
      max_pitch_deg: 3
      max_yaw_rate_deg: 30

  - name: stage1_easy
    env_kwargs:
      load: runs/ppo_multi/20251130_193337_stage0_warm/checkpoints/best_by_mfe.zip
      load_vecnorm: runs/ppo_multi/20251130_193337_stage0_warm/vecnormalize_final.pkl
      leader_speed_scale: 0.3    # moving leader now
      spawn_in_formation: true
      disable_dynamic: true      # sphere still off
      # keep formation weights same or slightly stronger
      form_w_mean: 1.8
      form_w_max: 0.9
      form_var_gain: 0.35
      alt_w: 0.9
      huber_delta: 0.3
      formation_spacing: 0.9
      min_sep: 0.55
      sep_radius: 0.38
      sep_gain: 1.2
      sep_hysteresis: 0.06
      thrust_delta_scale: 0.05
      speed_smooth_gain: 0.06
      max_roll_deg: 5
      max_pitch_deg: 5
      max_yaw_rate_deg: 45
